<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCCOE Techfest Registration Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-wrapper d-flex flex-column min-vh-100">
<div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
<div class="card form-card border-0 w-100 fade-up">
<div class="card-header text-center bg-white border-0 pt-5 pb-2">
<h2 class="form-title fw-bold">PCCOE Techfest Registration</h2>
<p class="text-muted">Fill out the details below to secure your spot.</p>
</div>
<div class="card-body px-4 px-md-5 pb-5">
<form>
<fieldset class="custom-fieldset mb-4">
<legend class="custom-legend px-2">Personal Information</legend>
<div class="mb-3">
<label for="fullName" class="form-label fw-medium">Full Name</label>
<input type="text" class="form-control custom-input" id="fullName" name="fullName" placeholder="Enter your full name">
</div>
<div class="mb-3">
<label for="emailAddress" class="form-label fw-medium">Email Address</label>
<input type="email" class="form-control custom-input" id="emailAddress" name="emailAddress" placeholder="Enter your email address">
</div>
<div class="mb-2">
<label class="form-label d-block fw-medium">Year of Study</label>
<div class="form-check form-check-inline custom-radio">
<input class="form-check-input" type="radio" name="yearStudy" id="fe" value="FE">
<label class="form-check-label" for="fe">FE</label>
</div>
<div class="form-check form-check-inline custom-radio">
<input class="form-check-input" type="radio" name="yearStudy" id="se" value="SE">
<label class="form-check-label" for="se">SE</label>
</div>
<div class="form-check form-check-inline custom-radio">
<input class="form-check-input" type="radio" name="yearStudy" id="te" value="TE">
<label class="form-check-label" for="te">TE</label>
</div>
<div class="form-check form-check-inline custom-radio">
<input class="form-check-input" type="radio" name="yearStudy" id="be" value="BE">
<label class="form-check-label" for="be">BE</label>
</div>
</div>
</fieldset>
<fieldset class="custom-fieldset mb-4">
<legend class="custom-legend px-2">Academic Details</legend>
<div class="mb-3">
<label for="engineeringBranch" class="form-label fw-medium">Engineering Branch</label>
<select class="form-select custom-input" id="engineeringBranch" name="engineeringBranch">
<option value="" selected disabled>Select your branch</option>
<option value="Computer">Computer</option>
<option value="IT">IT</option>
<option value="EnTC">EnTC</option>
<option value="Mechanical">Mechanical</option>
</select>
</div>
<div class="mb-2">
<label class="form-label d-block fw-medium">Events to Participate In</label>
<div class="form-check custom-checkbox mb-2">
<input class="form-check-input" type="checkbox" id="hackathon" name="events" value="Hackathon">
<label class="form-check-label" for="hackathon">Hackathon</label>
</div>
<div class="form-check custom-checkbox mb-2">
<input class="form-check-input" type="checkbox" id="webDesign" name="events" value="Web Design">
<label class="form-check-label" for="webDesign">Web Design</label>
</div>
<div class="form-check custom-checkbox">
<input class="form-check-input" type="checkbox" id="codeDebugging" name="events" value="Code Debugging">
<label class="form-check-label" for="codeDebugging">Code Debugging</label>
</div>
</div>
</fieldset>
<fieldset class="custom-fieldset mb-4">
<legend class="custom-legend px-2">Contact Details</legend>
<div class="mb-2">
<label for="localAddress" class="form-label fw-medium">Local Address</label>
<textarea class="form-control custom-input" id="localAddress" name="localAddress" rows="3" placeholder="Enter your local address in Pune, e.g. Thergaon"></textarea>
</div>
</fieldset>
<div class="d-flex gap-3 mt-4 pt-2">
<button type="submit" class="btn btn-primary custom-btn px-4 py-2 flex-grow-1">Submit Registration</button>
<button type="reset" class="btn btn-light custom-btn-outline px-4 py-2">Reset</button>
</div>
</form>
</div>
</div>
</div>
<footer class="page-footer text-center py-3 bg-white">made by Atharva Zope(123B1D067)</footer>
</div>
</body>
</html>
