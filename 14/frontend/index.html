<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Analysis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Student Performance Analysis Dashboard</h1>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <label for="studentSelect" class="form-label">Select Student</label>
                <select class="form-select" id="studentSelect">
                    <option value="0">Atharva Zope</option>
                    <option value="1">Adwait Kamble</option>
                    <option value="2">Aryan Aradhye</option>
                </select>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" id="studentName">Atharva Zope</h5>
                        <p class="card-text" id="studentInfo">PRN: 123B1D067 | Class: TY BTech</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Subject Marks (Bar Chart)
                    </div>
                    <div class="card-body">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Grade Distribution (Pie Chart)
                    </div>
                    <div class="card-body">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        Progress Over Time (Line Chart)
                    </div>
                    <div class="card-body">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">made by Atharva Zope(123B1D067)</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
